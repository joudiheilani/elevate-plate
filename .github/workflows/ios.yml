name: iOS app

# Builds the iPhone app on a GitHub-hosted Mac (no Mac needed locally).
# Run it from GitHub: Actions tab -> "iOS app" -> "Run workflow".
#   upload = false: test build for the iPhone simulator. Needs no Apple account.
#   upload = true:  signed release build, uploaded to App Store Connect / TestFlight.
#                   Needs the secrets and variable listed in docs/app-store/CHECKLIST.md.

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Sign and upload to App Store Connect"
        type: boolean
        default: false
      version:
        description: "Version shown in the App Store (e.g. 1.0.0)"
        type: string
        default: "1.0.0"

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.elevateplate.app' }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Use the newest Xcode on the runner
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Set the bundle ID
        run: |
          node -e "const f='capacitor.config.json';const c=require('./'+f);c.appId=process.env.BUNDLE_ID;require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
          cat capacitor.config.json

      - name: Create the Xcode project, icons and launch screen
        run: |
          npx cap add ios
          npm run assets
          npx cap sync ios

      - name: Info.plist settings
        run: |
          PLIST=ios/App/App/Info.plist
          # The app only uses standard HTTPS, which is exempt from export-compliance paperwork.
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Elevate Plate" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Elevate Plate" "$PLIST"

      - name: Find the Xcode project
        run: |
          if [ -d ios/App/App.xcworkspace ]; then
            echo "XCODE_TARGET=-workspace ios/App/App.xcworkspace" >> "$GITHUB_ENV"
          else
            echo "XCODE_TARGET=-project ios/App/App.xcodeproj" >> "$GITHUB_ENV"
          fi

      - name: Test build (simulator, unsigned)
        if: ${{ !inputs.upload }}
        run: |
          xcodebuild $XCODE_TARGET -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/build.log" 2>&1 || {
              grep -E "error:" "$RUNNER_TEMP/build.log" | head -40
              tail -60 "$RUNNER_TEMP/build.log"
              exit 1
            }
          tail -20 "$RUNNER_TEMP/build.log"

      - name: Write the App Store Connect API key
        if: ${{ inputs.upload }}
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF

      - name: Archive (signed release build)
        if: ${{ inputs.upload }}
        run: |
          xcodebuild $XCODE_TARGET -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_STYLE=Automatic \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="${{ inputs.version }}" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive > "$RUNNER_TEMP/archive.log" 2>&1 || {
              echo "::error::The signed build failed. Xcode's error lines are below."
              # Each error also becomes an annotation, shown on the run's summary page.
              grep -E "error:" "$RUNNER_TEMP/archive.log" | sort -u | head -8 \
                | sed 's/^/::error title=Xcode::/'
              grep -E "error:|[Pp]rovisioning|[Ss]igning|[Tt]eam" "$RUNNER_TEMP/archive.log" | head -40
              echo "----- last 60 lines of the build log -----"
              tail -60 "$RUNNER_TEMP/archive.log"
              exit 1
            }
          tail -20 "$RUNNER_TEMP/archive.log"

      - name: Upload to App Store Connect
        if: ${{ inputs.upload }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"
          echo "Uploaded version ${{ inputs.version }} (build $BUILD_NUMBER). It appears in App Store Connect > TestFlight after Apple finishes processing (usually 10-30 minutes)."

      - name: Clean up the key
        if: ${{ always() && inputs.upload }}
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
